# 注意：macos-14 runner 镜像已于 2026-11-01 退役，跑不起来（会直接 取消/失败）。
# 若 macos-15 将来也退役，把 runs-on 换成当时最新可用的镜像即可。
name: Build KAlertLog

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          set -e
          export THEOS=$HOME/theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          curl -fsSL https://github.com/theos/sdks/archive/master.tar.gz -o /tmp/sdks.tar.gz
          tar -xzf /tmp/sdks.tar.gz -C /tmp
          cp -R /tmp/sdks-master/*.sdk "$THEOS/sdks/" || true
          ls "$THEOS/sdks"

      # Theos 在 macOS 上不自带 ldid，签名阶段会直接 "ldid: command not found"。
      - name: Install toolchain deps (ldid / dpkg / xz)
        run: |
          set +e
          brew install ldid xz dpkg
          if ! command -v ldid >/dev/null 2>&1; then
            echo "brew 安装 ldid 失败，回落到 Procursus 预编译包"
            for asset in ldid_macosx_universal ldid_macosx_arm64 ldid_macosx_x86_64; do
              url="https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/$asset"
              if curl -fsSL "$url" -o /tmp/ldid; then
                chmod +x /tmp/ldid
                sudo mv /tmp/ldid /usr/local/bin/ldid
                break
              fi
            done
          fi
          set -e
          echo "--- 工具链自检"
          command -v ldid dpkg-deb xz || true
          ldid -v || ldid -V || true
          mkdir -p "$THEOS/bin"
          ln -sf "$(command -v ldid)" "$THEOS/bin/ldid" || true
          test -x "$(command -v ldid)"

      - name: Build package
        run: |
          set -e
          export PATH="$THEOS/bin:$PATH"
          make clean || true
          make -j4 FINALPACKAGE=1 DEBUG=0
          echo "--- 产物"
          find .theos -name "*.dylib" -type f -print

      - name: Collect dylib
        run: |
          set -e
          mkdir -p out
          DYLIB=$(find .theos -name "*.dylib" -type f -not -name "*.unsigned" | head -n 1)
          if [ -z "$DYLIB" ]; then
            echo "::error::没找到编译产物 dylib，检查 make 是否真的成功"
            exit 1
          fi
          echo "dylib=$DYLIB"
          NAME=$(basename "$DYLIB" .dylib)
          cp "$DYLIB" "out/${NAME}-fat.dylib"
          lipo -info "out/${NAME}-fat.dylib"
          lipo -thin arm64e "out/${NAME}-fat.dylib" -output "out/${NAME}-arm64e.dylib" || true
          lipo -thin arm64  "out/${NAME}-fat.dylib" -output "out/${NAME}-arm64.dylib"  || true
          for f in out/*.dylib; do echo "== $f"; lipo -info "$f"; done
          cd out && shasum -a 256 * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: KAlertLog
          path: out/*
          if-no-files-found: error
