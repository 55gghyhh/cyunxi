name: Build KXUniversal

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Make build script executable
      run: chmod +x build.sh

    - name: Compile Dylib
      run: ./build.sh

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KXUniversal
        path: "*.dylib"
